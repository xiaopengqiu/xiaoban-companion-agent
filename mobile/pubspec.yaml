name: companion_mobile
description: 有据可循、适度主动的智能穿戴陪伴客户端。
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  open_wearables_health_sdk: ^0.0.26
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  jpush_flutter: 3.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
