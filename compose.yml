services:
  companion:
    build: .
    ports:
      - "127.0.0.1:${COMPANION_PORT:-8765}:8765"
    env_file:
      - path: .env
        required: false
    environment:
      COMPANION_HOST: 0.0.0.0
      COMPANION_PORT: 8765
      COMPANION_DB_PATH: /app/data/companion.sqlite3
    volumes:
      - companion-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  companion-data:
